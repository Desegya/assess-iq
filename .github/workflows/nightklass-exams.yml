name: Nightklass exam preparation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nightklass_exam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nightklass_exam_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3101/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @assessiq/db
      - run: npm run db:migrate:deploy --workspace @assessiq/db
      - run: npm run build --workspace @assessiq/types
      - run: npm test --workspace @assessiq/api
      - run: npm run test:exam:integration --workspace @assessiq/api
      - run: npm run build --workspace @assessiq/nightklass
      - run: npm exec --workspace @assessiq/nightklass -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @assessiq/nightklass
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightklass-browser-failures
          path: apps/nightklass/test-results
          retention-days: 7
